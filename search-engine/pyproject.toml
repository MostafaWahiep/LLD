[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "progressive-search-engine"
version = "0.1.0"
description = "A progressively built low-level search engine design exercise"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typeid-python>=0.3.2",
]

[tool.setuptools.packages.find]
where = ["src"]
